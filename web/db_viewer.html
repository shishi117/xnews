<!DOCTYPE html>
<!-- x-collector-db-viewer -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Xニュース ビューア</title>
<style>
  :root {
    --bg: #f0f4f8; --card: #ffffff; --border: #e2e8f0; --text: #1a1a2e;
    --muted: #6b7280; --accent: #1d9bf0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: var(--bg);
    font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    color: var(--text);
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; margin-bottom: 12px;
  }
  .bar input[type="file"] { flex: 0 0 auto; }
  .bar input[type="text"], .bar select {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
  }
  .bar input[type="text"] { flex: 1 1 200px; }
  .axis-group { position: relative; font-size: 12px; color: var(--muted); }
  .axis-btn {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); font-size: 13px; color: inherit; white-space: nowrap;
  }
  .axis-btn.on { border-color: #2563eb; color: #1d4ed8; background: #eff6ff; }
  .axis-btn .cnt { font-size: 11px; color: var(--muted); }
  .axis-panel {
    display: none; position: absolute; z-index: 20; top: calc(100% + 4px); left: 0;
    min-width: 200px; max-height: 320px; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.12);
  }
  .axis-panel.open { display: block; }
  .axis-panel .mode { display: flex; gap: 10px; padding: 2px 4px 8px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .axis-panel label { display: flex; align-items: center; gap: 6px; padding: 3px 4px; cursor: pointer; font-size: 13px; }
  .axis-panel label:hover { background: #f1f5f9; border-radius: 4px; }
  .axis-panel .val-cnt { margin-left: auto; color: var(--muted); font-size: 11px; }
  .axis-actions { display: flex; gap: 8px; padding-top: 6px; border-top: 1px solid var(--border); margin-top: 6px; }
  .axis-actions button, #clearFilters {
    font-size: 12px; padding: 4px 8px; border: 1px solid var(--border);
    border-radius: 5px; background: #f8fafc; cursor: pointer;
  }
  #saveState { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  #status { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  #count { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  td.labels span.lbl {
    display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 11px;
    color: #fff; margin: 0 4px 4px 0;
  }
  table {
    width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden; font-size: 13px;
  }
  th, td {
    padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  th {
    background: #f8fafc; cursor: pointer; user-select: none; white-space: nowrap;
    position: sticky; top: 0;
  }
  th:hover { background: #eef2f7; }
  tr:hover td { background: #fafcff; }
  td.date { white-space: nowrap; color: var(--muted); font-size: 12px; }
  td.badge span {
    display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 11px;
    background: #eef2f7; color: #33526e; border: 1px solid #c8d8ea; margin-right: 4px;
  }
  td.text { max-width: 420px; }
  td.text .translation { font-weight: 600; }
  td.text .orig { color: var(--muted); font-size: 12px; margin-top: 2px; }
  td a { color: var(--accent); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  #empty {
    text-align: center; color: var(--muted); padding: 40px 20px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  }
</style>
</head>
<body>
  <h1>Xニュース ビューア</h1>
  <div class="bar">
    <input type="text" id="search" placeholder="キーワード検索（訳文・原文・ラベル値など）" disabled>
    <span id="status">読み込み中…</span>
  </div>
  <div class="bar" id="axisFilterBar" style="display:none;">
    <!-- 軸ごとの絞り込み（複数選択＋AND/OR）をここに動的生成する。
         個数・名称はDBの中身から自動検出するので、軸を増減してもこのファイルは編集不要。 -->
    <button id="clearFilters" type="button">フィルタをクリア</button>
    <span id="saveState"></span>
  </div>
  <p id="count"></p>
  <div id="empty">読み込み中…</div>
  <div style="overflow-x:auto;">
  <table id="tbl" style="display:none;">
    <thead>
      <tr>
        <th data-k="created_at">日時</th>
        <th data-k="source">取得元</th>
        <th>ラベル</th>
        <th data-k="translation">内容（訳文/原文）</th>
        <th data-k="url">リンク</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  </div>

<!-- x_collector.py が書き出す data/news_data.js を読み込む（サーバ不要・file://で直接開ける）。
     news_log/news_labels の中身をJSON化しただけのファイル。未生成（初回実行前）でも
     読み込み失敗は無視される（下のJSが window.__NEWS_ITEMS の有無で案内を出す）。 -->
<script src="../data/news_data.js" onerror="console.warn('news_data.js なし')"></script>
<script>
let rows = [];       // {tweet_id, created_at, source, translation, summary, url, labels:{軸:[値,...]}}
let sortKey = "created_at", sortAsc = false;

function esc(s) {
  return (s == null ? "" : String(s))
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// 軸ごとの色（LABEL_AXESの個数・名称に依存しない決定的パレット。x_collector.py の
// axis_color() と考え方を揃えている）
const BADGE_PALETTE = ["#0f3460", "#276439", "#842029", "#7a4a00", "#4a235a",
                        "#155e63", "#6b4d1f", "#33526e", "#7c2d92", "#1d6f5e"];
function axisColor(axis) {
  let s = 0;
  for (const ch of axis) s += ch.codePointAt(0);
  return BADGE_PALETTE[s % BADGE_PALETTE.length];
}

// ---- フィルタ条件（軸ごとに複数選択＋AND/OR）と、その保存 --------------------
// filters = { 軸名: { values: [選んだ値...], mode: "or" | "and" } }
// 軸と軸の【間】は常にAND。1つの軸の【中】が or/and で切り替わる。
//   or : 選んだ値のどれかを持つ記事（国・地域で「米国」or「中国」など）
//   and: 選んだ値を全部持つ記事（国・地域が「米国」かつ「イラン」の記事だけ、など）
let filters = {};
const SAVE_KEY = "xnews_db_viewer_filters_v1";

function saveFilters() {
  const state = { filters, q: document.getElementById("search").value,
                  sortKey, sortAsc };
  const note = document.getElementById("saveState");
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    if (note) note.textContent = "条件を保存しました";
  } catch (e) {
    // file:// でlocalStorageが無効なブラウザや、プライベートウィンドウでは失敗する。
    // 失敗しても絞り込み自体は動くので、黙って落とさず表示だけ出す。
    if (note) note.textContent = "条件を保存できません（ブラウザ設定）";
    console.warn("保存失敗:", e);
  }
}

function loadFilters() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    console.warn("保存済み条件の読み込み失敗:", e);
    return null;
  }
}

function activeFilters() {
  return Object.entries(filters).filter(([, f]) => f && f.values && f.values.length);
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();

  let list = rows.filter(r => {
    for (const [axis, f] of activeFilters()) {
      const have = r.labels[axis] || [];
      const ok = f.mode === "and"
        ? f.values.every(v => have.includes(v))   // 選んだ値を全部持つ
        : f.values.some(v => have.includes(v));   // 選んだ値のどれかを持つ
      if (!ok) return false;
    }
    if (!q) return true;
    const labelText = Object.values(r.labels).flat().join(" ");
    const hay = [r.translation, r.summary, r.source, labelText].join(" ").toLowerCase();
    return hay.includes(q);
  });
  list.sort((a, b) => {
    const av = (a[sortKey] ?? ""), bv = (b[sortKey] ?? "");
    const cmp = av < bv ? -1 : av > bv ? 1 : 0;
    return sortAsc ? cmp : -cmp;
  });
  document.getElementById("count").textContent =
    `${list.length} / ${rows.length} 件表示`;
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = list.map(r => {
    const badges = Object.entries(r.labels).flatMap(([a, vs]) =>
      vs.map(v => `<span class="lbl" style="background:${axisColor(a)};">${esc(a)}: ${esc(v)}</span>`)
    ).join("");
    return `
    <tr>
      <td class="date">${esc(r.created_at)}</td>
      <td class="badge"><span>${esc(r.source)}</span></td>
      <td class="labels">${badges}</td>
      <td class="text">
        <div class="translation">${esc(r.translation || "(訳なし)")}</div>
        <div class="orig">${esc((r.summary || "").slice(0, 140))}</div>
      </td>
      <td>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">開く</a>` : ""}</td>
    </tr>
  `;
  }).join("");
}

document.querySelectorAll("th[data-k]").forEach(th => {
  th.addEventListener("click", () => {
    const k = th.dataset.k;
    if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = false; }
    render();
    saveFilters();
  });
});
document.getElementById("search").addEventListener("input", () => { render(); saveFilters(); });

// 軸ごとの絞り込みUIをデータから動的生成（LABEL_AXESの個数・名称を変えても
// このファイルは編集不要＝DBの中身から自己記述的に組み立てる）
function buildAxisFilters() {
  const axisNames = [...new Set(rows.flatMap(r => Object.keys(r.labels)))].sort();
  const bar = document.getElementById("axisFilterBar");
  const clearBtn = document.getElementById("clearFilters");
  const note = document.getElementById("saveState");
  // ★bar.innerHTML = "" にしてはいけない。「フィルタをクリア」ボタンと保存メッセージも
  //   barの子要素なので一緒に消え、下の insertBefore(wrap, clearBtn) が
  //   「基準ノードが子ではない」で失敗する（実ブラウザで発生。Node側のスタブでは
  //   innerHTMLが子を消さなかったため見逃していた）。軸のUIだけを取り除く。
  for (const old of [...bar.children]) {
    if (old.classList && old.classList.contains("axis-group")) old.remove();
  }
  bar.style.display = axisNames.length ? "flex" : "none";

  for (const axis of axisNames) {
    // 値ごとの件数も出す（0件の値を選んでしまう迷いを減らす）
    const counts = new Map();
    for (const r of rows) for (const v of (r.labels[axis] || [])) {
      counts.set(v, (counts.get(v) || 0) + 1);
    }
    const values = [...counts.keys()].sort();
    if (!filters[axis]) filters[axis] = { values: [], mode: "or" };
    // 保存済みの値のうち、今のDBに存在しないものは捨てる（軸や値が変わっても壊れない）
    filters[axis].values = filters[axis].values.filter(v => counts.has(v));

    const wrap = document.createElement("span");
    wrap.className = "axis-group";
    wrap.dataset.axis = axis;

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "axis-btn";
    btn.dataset.axis = axis;

    const panel = document.createElement("div");
    panel.className = "axis-panel";
    panel.dataset.axis = axis;

    const mode = document.createElement("div");
    mode.className = "mode";
    for (const [m, text] of [["or", "いずれか(OR)"], ["and", "すべて(AND)"]]) {
      const lb = document.createElement("label");
      const rb = document.createElement("input");
      rb.type = "radio";
      rb.name = "mode-" + axis;
      rb.value = m;
      rb.dataset.axis = axis;
      rb.dataset.mode = m;
      rb.checked = filters[axis].mode === m;
      rb.addEventListener("change", () => {
        filters[axis].mode = m;
        syncBtn();
        render();
        saveFilters();
      });
      lb.appendChild(rb);
      lb.appendChild(document.createTextNode(text));
      mode.appendChild(lb);
    }
    panel.appendChild(mode);

    for (const v of values) {
      const lb = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.dataset.axis = axis;
      cb.value = v;
      cb.checked = filters[axis].values.includes(v);
      cb.addEventListener("change", () => {
        const cur = new Set(filters[axis].values);
        if (cb.checked) cur.add(v); else cur.delete(v);
        filters[axis].values = [...cur];
        syncBtn();
        render();
        saveFilters();
      });
      const cnt = document.createElement("span");
      cnt.className = "val-cnt";
      cnt.textContent = counts.get(v);
      lb.appendChild(cb);
      lb.appendChild(document.createTextNode(v));
      lb.appendChild(cnt);
      panel.appendChild(lb);
    }

    const actions = document.createElement("div");
    actions.className = "axis-actions";
    const clearOne = document.createElement("button");
    clearOne.type = "button";
    clearOne.textContent = "この軸をクリア";
    clearOne.addEventListener("click", () => {
      filters[axis].values = [];
      panel.querySelectorAll('input[type="checkbox"]').forEach(c => { c.checked = false; });
      syncBtn();
      render();
      saveFilters();
    });
    actions.appendChild(clearOne);
    panel.appendChild(actions);

    function syncBtn() {
      const f = filters[axis];
      const n = f.values.length;
      btn.classList.toggle("on", n > 0);
      const label = n === 0 ? "すべて"
        : n === 1 ? f.values[0]
        : `${n}件 (${f.mode === "and" ? "AND" : "OR"})`;
      btn.innerHTML = `${esc(axis)}: <span class="cnt">${esc(label)}</span> ▾`;
    }
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const wasOpen = panel.classList.contains("open");
      document.querySelectorAll(".axis-panel.open").forEach(p => p.classList.remove("open"));
      if (!wasOpen) panel.classList.add("open");
    });
    panel.addEventListener("click", ev => ev.stopPropagation());
    syncBtn();
    wrap.appendChild(btn);
    wrap.appendChild(panel);
    if (clearBtn && clearBtn.parentNode === bar) bar.insertBefore(wrap, clearBtn);
    else bar.appendChild(wrap);
  }

  if (clearBtn && !clearBtn.dataset.bound) {
    clearBtn.dataset.bound = "1";
    clearBtn.addEventListener("click", () => {
      for (const a of Object.keys(filters)) filters[a] = { values: [], mode: filters[a].mode };
      document.getElementById("search").value = "";
      buildAxisFilters();
      render();
      saveFilters();
    });
  }
  if (note && !note.textContent) note.textContent = "条件はこのブラウザに保存されます";
}

// パネルの外側クリックで閉じる
document.addEventListener("click", () => {
  document.querySelectorAll(".axis-panel.open").forEach(p => p.classList.remove("open"));
});

// x_collector.py が書き出した window.__NEWS_ITEMS（news_data.js）を表示用の rows にする。
// 既にtweet_idごとに labels:{axis:[値,...]} へ組み立て済みのJSONなので、ここではもう
// SQLもパースも不要（サーバもDBエンジンもブラウザ側には要らない＝この関数だけで完結する）。
function loadFromItems(items, sourceLabel) {
  // created_at文字列は "YYYY/MM/DD HH:MM" 形式で辞書順=時系列順になるためそのままsortできる
  rows = [...items].sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
  // 保存済みの条件を先に復元してからUIを組み立てる（開いた瞬間に前回の絞り込みで表示）
  const saved = loadFilters();
  if (saved) {
    filters = (saved.filters && typeof saved.filters === "object") ? saved.filters : {};
    for (const [a, f] of Object.entries(filters)) {           // 壊れた保存内容に耐える
      if (!f || !Array.isArray(f.values)) filters[a] = { values: [], mode: "or" };
      else if (f.mode !== "and") f.mode = "or";
    }
    if (typeof saved.q === "string") document.getElementById("search").value = saved.q;
    if (typeof saved.sortKey === "string") sortKey = saved.sortKey;
    if (typeof saved.sortAsc === "boolean") sortAsc = saved.sortAsc;
  }
  buildAxisFilters();
  document.getElementById("search").disabled = false;
  document.getElementById("empty").style.display = rows.length ? "none" : "block";
  document.getElementById("tbl").style.display = rows.length ? "table" : "none";
  if (!rows.length) document.getElementById("empty").textContent = "データがまだありません。";
  document.getElementById("status").textContent =
    `${sourceLabel} 読み込み完了（${rows.length}件）`;
  render();
}

function showLoadError(msg) {
  document.getElementById("status").textContent = "読み込み失敗";
  const empty = document.getElementById("empty");
  empty.style.display = "block";
  empty.textContent = msg;
}

// 読み込み元は data/news_data.js（x_collector.py が実行のたびに書き出すJSON）に固定。
// サーバは使わない＝file:// でこのファイルを直接ダブルクリックして開く運用。
try {
  if (!window.__NEWS_ITEMS) {
    showLoadError("データがありません。x_collector.py を一度実行すると "
      + "data/news_data.js が作られ、このまま開けるようになります。");
  } else {
    loadFromItems(window.__NEWS_ITEMS,
                  "news_data.js（" + (window.__NEWS_DATA_AT || "日時不明") + "時点）");
  }
} catch (e) {
  showLoadError("データを読み込めませんでした: " + e.message);
  console.error(e);
}
</script>
</body>
</html>
